name: C/C++ CI

on:
  push:
    branches: [ "dev", "release" ]
  pull_request:
    branches: [ "dev", "release" ]

jobs:
  buildAndRun:

    runs-on: ubuntu-latest

    steps:
    - name: "Checkout repository"
      uses: actions/checkout@v3

    - name: ci
      run: cd scripts; chmod +x ci.sh; ./ci.sh
